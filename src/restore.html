<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="restorePageTitle">Restore tabs | Tab Backup</title>
  </head>
  <body
    class="grid min-h-screen place-items-center bg-white text-neutral-900 dark:bg-neutral-900 dark:text-white"
  >
    <main
      class="flex w-full max-w-md flex-col items-center gap-4 px-4 py-12 text-center"
    >
      <!-- Hand-drawn archive box, arrow out (same as the popup's Restore… icon) -->
      <svg
        aria-hidden="true"
        width="56"
        height="56"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="text-neutral-400 dark:text-neutral-500"
      >
        <path
          d="M3.6 5.2c5.6-.5 11.2-.5 16.8 0 .3 1.2.3 2.3 0 3.4-5.6.4-11.2.4-16.8 0-.3-1.1-.3-2.2 0-3.4z"
        />
        <path
          d="M5 8.8c-.1 3-.1 6 .1 9 .1.9.7 1.5 1.6 1.5 3.6.2 7.1.2 10.7 0 .9 0 1.5-.6 1.5-1.5.2-3 .2-6 .1-9"
        />
        <path d="M12 15.8c-.1-1.5 0-3 .1-4.6" />
        <path d="M9.9 13.1c.8-.8 1.4-1.4 2.2-2 .7.8 1.3 1.4 2 2.2" />
      </svg>

      <h1 class="text-xl font-semibold" data-i18n="restoreHeading">
        Restore tabs
      </h1>
      <div id="start-view" class="flex w-full flex-col items-center gap-4">
        <p
          class="text-sm text-neutral-500 dark:text-neutral-400"
          data-i18n="restoreIntro"
        >
          Choose a backup file saved with Tab Backup. You can pick which tabs to
          open before they open in this window.
        </p>

        <!-- The native input is visually hidden; the label below is its button. -->
        <input
          class="peer sr-only"
          type="file"
          id="input"
          accept=".json,.md,.txt,.html,application/json,text/markdown,text/plain,text/html"
        />
        <label
          for="input"
          class="mt-2 inline-flex h-12 cursor-pointer items-center rounded-lg bg-neutral-800 px-5 font-semibold text-white peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-neutral-800 hover:bg-neutral-700 dark:bg-neutral-100 dark:text-neutral-900 dark:peer-focus-visible:outline-neutral-100 dark:hover:bg-neutral-300"
          data-i18n="chooseFile"
        >
          Choose backup file…
        </label>

        <section
          id="synced"
          hidden
          class="mt-4 flex w-full flex-col gap-2 text-left"
        >
          <h2 class="text-sm font-semibold" data-i18n="bookmarkBackups">
            Bookmark backups
          </h2>
          <ul
            id="synced-list"
            class="divide-y divide-neutral-200 rounded-lg border border-neutral-200 dark:divide-neutral-700 dark:border-neutral-700"
          ></ul>
          <p
            id="synced-empty"
            hidden
            data-i18n="noBookmarkBackups"
            class="text-sm text-neutral-500 dark:text-neutral-400"
          >
            No bookmark backups yet. Backups from your other devices appear here
            once Firefox Sync has run.
          </p>
        </section>
      </div>

      <section
        id="preview"
        hidden
        aria-labelledby="preview-title"
        class="flex w-full flex-col gap-3 text-left"
      >
        <div class="flex flex-col">
          <h2 id="preview-title" class="truncate text-sm font-semibold"></h2>
          <p
            id="preview-summary"
            class="text-sm text-neutral-500 dark:text-neutral-400"
          ></p>
        </div>

        <div class="flex flex-wrap items-center gap-x-3 gap-y-1 text-sm">
          <button
            type="button"
            id="select-all"
            data-i18n="selectAll"
            class="cursor-pointer text-neutral-600 underline-offset-2 hover:underline dark:text-neutral-300"
          >
            Select all
          </button>
          <button
            type="button"
            id="select-none"
            data-i18n="selectNone"
            class="cursor-pointer text-neutral-600 underline-offset-2 hover:underline dark:text-neutral-300"
          >
            Select none
          </button>
          <label
            id="skip-open-label"
            class="ml-auto flex cursor-pointer items-center gap-2"
          >
            <input
              type="checkbox"
              id="skip-open"
              checked
              class="accent-neutral-800 dark:accent-neutral-100"
            />
            <span data-i18n="skipOpenTabs"
              >Skip tabs that are already open</span
            >
          </label>
        </div>

        <ul
          id="preview-list"
          class="max-h-[60vh] divide-y divide-neutral-200 overflow-y-auto rounded-lg border border-neutral-200 dark:divide-neutral-700 dark:border-neutral-700"
        ></ul>

        <div class="flex justify-end gap-2">
          <button
            type="button"
            id="preview-cancel"
            data-i18n="cancel"
            class="h-9 cursor-pointer rounded-md border border-neutral-300 px-4 text-sm font-medium hover:bg-neutral-100 dark:border-neutral-600 dark:hover:bg-neutral-800"
          >
            Cancel
          </button>
          <button
            type="button"
            id="preview-open"
            class="h-9 cursor-pointer rounded-md bg-neutral-800 px-4 text-sm font-medium text-white hover:bg-neutral-700 dark:bg-neutral-100 dark:text-neutral-900 dark:hover:bg-neutral-300"
          ></button>
        </div>
      </section>

      <p
        id="status"
        role="status"
        class="min-h-5 text-sm text-neutral-500 dark:text-neutral-400"
      ></p>
    </main>
    <script src="restore.js"></script>
  </body>
</html>
