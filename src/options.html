<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Restore tabs | Tab Backup</title>
  </head>
  <body
    class="grid min-h-screen place-items-center bg-white text-neutral-900 dark:bg-neutral-900 dark:text-white"
  >
    <main class="flex max-w-sm flex-col items-center gap-4 px-4 text-center">
      <!-- Hand-drawn archive box, arrow out (same as the popup's Restore… icon) -->
      <svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-neutral-400 dark:text-neutral-500">
        <path d="M3.6 5.2c5.6-.5 11.2-.5 16.8 0 .3 1.2.3 2.3 0 3.4-5.6.4-11.2.4-16.8 0-.3-1.1-.3-2.2 0-3.4z" />
        <path d="M5 8.8c-.1 3-.1 6 .1 9 .1.9.7 1.5 1.6 1.5 3.6.2 7.1.2 10.7 0 .9 0 1.5-.6 1.5-1.5.2-3 .2-6 .1-9" />
        <path d="M12 15.8c-.1-1.5 0-3 .1-4.6" />
        <path d="M9.9 13.1c.8-.8 1.4-1.4 2.2-2 .7.8 1.3 1.4 2 2.2" />
      </svg>

      <h1 class="text-xl font-semibold">Restore tabs</h1>
      <p class="text-sm text-neutral-500 dark:text-neutral-400">
        Choose a backup file saved with Tab Backup. Its tabs open in this
        window.
      </p>

      <!-- The native input is visually hidden; the label below is its button. -->
      <input
        class="peer sr-only"
        type="file"
        id="input"
        accept="application/json"
      />
      <label
        for="input"
        class="mt-2 inline-flex h-12 cursor-pointer items-center rounded-lg bg-neutral-800 px-5 font-semibold text-white peer-focus-visible:outline-2 peer-focus-visible:outline-offset-2 peer-focus-visible:outline-neutral-800 hover:bg-neutral-700 dark:bg-neutral-100 dark:text-neutral-900 dark:peer-focus-visible:outline-neutral-100 dark:hover:bg-neutral-300"
      >
        Choose backup file…
      </label>
    </main>
    <script src="options.js"></script>
  </body>
</html>
