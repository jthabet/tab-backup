<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>popup</title>
  </head>
  <body class="dark:bg-neutral-900 dark:text-white">
    <div class="h-128 w-96 overflow-auto bg-inherit">
      <div class="sticky top-0 flex justify-center gap-2 bg-inherit p-2.5">
        <button
          type="button"
          id="backup"
          class="flex h-8 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-neutral-800 bg-neutral-800 px-3 text-sm font-medium text-white hover:border-neutral-700 hover:bg-neutral-700 dark:border-neutral-100 dark:bg-neutral-100 dark:text-neutral-900 dark:hover:border-neutral-300 dark:hover:bg-neutral-300"
        >
          <!-- Hand-drawn archive box, arrow in -->
          <svg
            aria-hidden="true"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M3.6 5.2c5.6-.5 11.2-.5 16.8 0 .3 1.2.3 2.3 0 3.4-5.6.4-11.2.4-16.8 0-.3-1.1-.3-2.2 0-3.4z"
            />
            <path
              d="M5 8.8c-.1 3-.1 6 .1 9 .1.9.7 1.5 1.6 1.5 3.6.2 7.1.2 10.7 0 .9 0 1.5-.6 1.5-1.5.2-3 .2-6 .1-9"
            />
            <path d="M12 11.2c-.1 1.5 0 3 .1 4.6" />
            <path d="M9.9 13.9c.8.8 1.4 1.4 2.2 2 .7-.8 1.3-1.4 2-2.2" />
          </svg>
          Back up
        </button>

        <button
          type="button"
          id="restore"
          class="flex h-8 cursor-pointer items-center justify-center gap-1.5 rounded-md border border-neutral-300 px-3 text-sm font-medium text-neutral-800 hover:bg-neutral-100 dark:border-neutral-600 dark:text-neutral-100 dark:hover:bg-neutral-800"
        >
          <!-- Hand-drawn archive box, arrow out -->
          <svg
            aria-hidden="true"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M3.6 5.2c5.6-.5 11.2-.5 16.8 0 .3 1.2.3 2.3 0 3.4-5.6.4-11.2.4-16.8 0-.3-1.1-.3-2.2 0-3.4z"
            />
            <path
              d="M5 8.8c-.1 3-.1 6 .1 9 .1.9.7 1.5 1.6 1.5 3.6.2 7.1.2 10.7 0 .9 0 1.5-.6 1.5-1.5.2-3 .2-6 .1-9"
            />
            <path d="M12 15.8c-.1-1.5 0-3 .1-4.6" />
            <path d="M9.9 13.1c.8-.8 1.4-1.4 2.2-2 .7.8 1.3 1.4 2 2.2" />
          </svg>
          Restore…
        </button>

        <button
          type="button"
          id="settings"
          aria-label="Settings"
          title="Settings"
          class="flex size-8 cursor-pointer items-center justify-center rounded-md text-neutral-600 hover:bg-neutral-100 hover:text-neutral-900 dark:text-neutral-400 dark:hover:bg-neutral-800 dark:hover:text-neutral-100"
        >
          <!-- Hand-drawn soft gear -->
          <svg
            aria-hidden="true"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M12 3.09C12.6 2.77 13.51 2.73 14.02 3.15C14.53 3.58 14.67 5.08 15.06 5.64C15.46 6.19 15.73 6.37 16.39 6.49C17.06 6.61 18.45 6.1 19.07 6.36C19.69 6.63 20.14 7.42 20.11 8.09C20.08 8.77 19.05 9.78 18.89 10.43C18.73 11.08 18.82 11.4 19.15 12C19.47 12.6 20.66 13.36 20.82 14.01C20.98 14.66 20.66 15.5 20.12 15.91C19.58 16.31 18.19 16.17 17.58 16.45C16.96 16.72 16.72 16.95 16.44 17.57C16.17 18.19 16.34 19.63 15.93 20.16C15.52 20.69 14.65 20.91 13.99 20.73C13.34 20.55 12.6 19.37 12 19.08C11.4 18.78 11.07 18.78 10.41 18.96C9.76 19.14 8.74 20.14 8.08 20.14C7.42 20.14 6.71 19.59 6.44 18.97C6.16 18.36 6.56 17.1 6.42 16.45C6.28 15.8 6.15 15.48 5.61 15.08C5.06 14.67 3.6 14.53 3.15 14.02C2.71 13.51 2.61 12.6 2.94 12C3.28 11.4 4.7 10.95 5.14 10.44C5.59 9.92 5.64 9.6 5.6 8.92C5.56 8.24 4.78 7 4.9 6.34C5.03 5.68 5.7 5.06 6.37 4.94C7.03 4.81 8.23 5.56 8.91 5.58C9.58 5.6 9.9 5.48 10.42 5.06C10.93 4.65 11.4 3.41 12 3.09Z"
            />
            <path
              d="M15.06 12C15.07 12.71 14.67 13.67 14.16 14.16C13.65 14.66 12.71 14.99 12 14.98C11.29 14.97 10.4 14.6 9.9 14.1C9.39 13.61 8.95 12.7 8.95 12C8.95 11.3 9.39 10.39 9.9 9.9C10.4 9.41 11.3 9.05 12 9.05C12.7 9.05 13.59 9.41 14.1 9.9C14.61 10.39 15.05 11.29 15.06 12Z"
            />
          </svg>
        </button>
      </div>

      <!-- Shown when a bookmark backup would delete older backups. -->
      <section
        id="limit-notice"
        hidden
        role="alertdialog"
        aria-labelledby="limit-title"
        aria-describedby="limit-text"
        class="mx-2.5 mb-2.5 rounded-lg border border-neutral-200 p-3 text-sm dark:border-neutral-700"
      >
        <h2 id="limit-title" class="font-medium"></h2>
        <p
          id="limit-text"
          class="mt-1 text-neutral-500 dark:text-neutral-400"
        ></p>
        <ul
          id="limit-list"
          class="mt-1 list-inside list-disc text-neutral-500 dark:text-neutral-400"
        ></ul>
        <div class="mt-3 flex items-center gap-2">
          <button
            type="button"
            id="limit-settings"
            class="mr-auto cursor-pointer text-neutral-600 underline-offset-2 hover:underline dark:text-neutral-300"
          >
            Change limit
          </button>
          <button
            type="button"
            id="limit-cancel"
            class="h-8 cursor-pointer rounded-md border border-neutral-300 px-3 font-medium text-neutral-800 hover:bg-neutral-100 dark:border-neutral-600 dark:text-neutral-100 dark:hover:bg-neutral-800"
          >
            Cancel
          </button>
          <button
            type="button"
            id="limit-confirm"
            class="h-8 cursor-pointer rounded-md bg-neutral-800 px-3 font-medium text-white hover:bg-neutral-700 dark:bg-neutral-100 dark:text-neutral-900 dark:hover:bg-neutral-300"
          >
            Back up anyway
          </button>
        </div>
      </section>

      <div class="border-t border-neutral-200 px-3 dark:border-neutral-800">
        <ol
          id="tabs-list"
          class="m-1 mt-4 mb-3 ml-3 w-11/12 list-inside list-disc space-y-2 font-sans text-sm font-normal subpixel-antialiased"
        ></ol>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
