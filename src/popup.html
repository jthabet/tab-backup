<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title>popup</title>
  </head>
  <body class="dark:bg-neutral-900 dark:text-white">
    <div class="h-128 w-96 overflow-auto bg-inherit">
      <div class="sticky top-0 flex justify-center gap-3 bg-inherit p-2">
        <button
          type="button"
          id="backup"
          class="flex h-12 min-w-28 cursor-pointer items-center justify-center gap-2 rounded-lg border-2 border-blue-600 bg-blue-600 px-4 text-white hover:border-blue-700 hover:bg-blue-700"
        >
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19h-7a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2h4l3 3h7a2 2 0 0 1 2 2v3.5" />
            <path d="M19 16v6" />
            <path d="M22 19l-3 3l-3 -3" />
          </svg>
          Back up
        </button>

        <button
          type="button"
          id="restore"
          class="flex h-12 min-w-28 cursor-pointer items-center justify-center gap-2 rounded-lg border-2 border-blue-600 px-4 text-blue-600 hover:bg-blue-600/10 dark:text-blue-400"
        >
          <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 19h-7a2 2 0 0 1 -2 -2v-11a2 2 0 0 1 2 -2h4l3 3h7a2 2 0 0 1 2 2v3.5" />
            <path d="M19 22v-6" />
            <path d="M22 19l-3 -3l-3 3" />
          </svg>
          Restore…
        </button>
      </div>

      <div class="border-t border-slate-700 px-3">
        <ol
          id="tabs-list"
          class="m-1 mt-5 mb-4 ml-3 w-11/12 list-inside list-disc space-y-3 font-sans font-normal subpixel-antialiased"
        ></ol>
      </div>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
